version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: space-postgres-dev
    environment:
      POSTGRES_DB: space_db_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: REDACTED_PASSWORD
      POSTGRES_MULTIPLE_DATABA1SES: space_db_dev,space_db_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init-database.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d space_db_dev"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: space-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Optionally run the app in container too
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: space-app-dev
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   environment:
  #     SPRING_PROFILES_ACTIVE: dev
  #     DB_USERNAME: postgres
  #     DB_PASSWORD: password
  #     DB_HOST: postgres
  #     DB_PORT: 5432
  #     DB_NAME: space_db_dev
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - ./uploads:/app/uploads

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  default:
    name: space-network