version: "3.8"

services:
  app:
    build: .
    container_name: s-space-app-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: space_db_prod
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - s-space-network

  postgres:
    image: postgres:15-alpine
    container_name: s-space-postgres-prod
    environment:
      POSTGRES_DB: space_db_prod
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./init-database.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d space_db_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - s-space-network

  redis:
    image: redis:7-alpine
    container_name: s-space-redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - s-space-network

  nginx:
    image: nginx:alpine
    container_name: s-space-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - s-space-network

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  s-space-network:
    driver: bridge

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:REDACTED_IP}:${DB_PORT:5432}/${DB_NAME:space_db}
    username: postgres
    password: REDACTED_PASSWORD
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    show-sql: false
  flyway:
    clean-disabled: true
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 2000ms
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: "https://s-pace.com.vn/login/oauth2/code/google"

logging:
  level:
    org.flywaydb: WARN
    com.space: INFO

server:
  port: ${SERVER_PORT:8080}
  # Trust Cloudflare proxy headers
  forward-headers-strategy: framework

# Cloudflare specific configuration
cloudflare:
  # Enable Cloudflare IP validation
  ip-validation: true
  # Trusted proxy IPs (Cloudflare IP ranges)
  trusted-proxies:
    - 173.245.48.0/20
    - 103.21.244.0/22
    - 103.22.200.0/22
    - 103.31.4.0/22
    - 141.101.64.0/18
    - 108.162.192.0/18
    - 190.93.240.0/20
    - 188.114.96.0/20
    - 197.234.240.0/22
    - 198.41.128.0/17
    - 162.158.0.0/15
    - 104.16.0.0/13
    - 104.24.0.0/14
    - 172.64.0.0/13
    - 131.0.72.0/22

# Security headers
security:
  headers:
    frame-options: SAMEORIGIN
    content-type-options: nosniff
    xss-protection: "1; mode=block"
    referrer-policy: strict-origin-when-cross-origin

# CORS Configuration  
app:
  cors:
    allowed-origins: "https://s-pace.com.vn,https://www.s-pace.com.vn,http://s-pace.com.vn,http://www.s-pace.com.vn"

services:
  app:
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1.5G

  postgres:
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1.5G
