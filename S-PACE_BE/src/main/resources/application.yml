spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/space_db
    username: postgres
    password: REDACTED_PASSWORD
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
        # Cải thiện performance
        connection:
          provider_disables_autocommit: true
        cache:
          use_second_level_cache: false
          use_query_cache: false
        order_updates: true
        order_inserts: true
        batch_size: 25

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    schemas: public
    create-schemas: true
    validate-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    database: 0
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: 2000ms

  # Di chuyển JWT config ra ngoài spring namespace
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:}

# Custom JWT configuration
jwt:
  secret: ${JWT_SECRET:mySecretKeyREDACTED_PASSWORD67890REDACTED_PASSWORD67890REDACTED_PASSWORD67890}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days

file:
  upload:
    cv-dir: ${FILE_UPLOAD_CV_DIR:./uploads/cvs}
    certificate-dir: ${FILE_UPLOAD_CERT_DIR:./uploads/certificates}
    avatar-dir: ${FILE_UPLOAD_AVATAR_DIR:./uploads/avatars}
    max-file-size: 10MB
    allowed-extensions:
      cv: pdf,doc,docx
      certificate: pdf,png,jpg,jpeg
      avatar: png,jpg,jpeg

server:
  port: ${SERVER_PORT:8080}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
    context-path: ${SERVER_CONTEXT_PATH:}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
  http2:
    enabled: true

# Application specific config
app:
  name: S-PACE
  version: ${APP_VERSION:1.0.0}
  environment: ${APP_ENV:development}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

logging:
  level:
    com.example.S_PACE: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}
    org.flywaydb: INFO
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
    org.hibernate.type.descriptor.sql: WARN
    org.springframework.web: ${WEB_LOG_LEVEL:WARN}
  file:
    name: ${LOG_FILE_PATH:./logs/space-app.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
    info:
      enabled: true
  info:
    env:
      enabled: true
    git:
      mode: full
    build:
      enabled: true

# Validation
spring.jpa.open-in-view: false

---
# Development profile
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  logging:
    level:
      com.example.S_PACE: DEBUG
      org.springframework.security: DEBUG
      org.hibernate.SQL: DEBUG

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  logging:
    level:
      com.example.S_PACE: WARN
      org.springframework.security: WARN
      org.hibernate.SQL: WARN