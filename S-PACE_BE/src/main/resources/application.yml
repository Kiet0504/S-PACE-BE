spring:
  datasource:
    url: jdbc:mysql://localhost:3306/space_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}

  redis:
    host: localhost
    port: 6379

file:
  upload:
    cv-dir: ./uploads/cvs
    certificate-dir: ./uploads/certificates
    max-file-size: 10MB