spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev,oauth}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:space_db_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:REDACTED_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      leak-detection-threshold: 60000
      auto-commit: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        jdbc.lob.non_contextual_creation: true
        connection.provider_disables_autocommit: true
        cache:
          use_second_level_cache: false
          use_query_cache: false
        order_updates: true
        order_inserts: true
        batch_size: 25

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    schemas: public
    create-schemas: true
    validate-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    default-encoding: UTF-8
    protocol: smtp
    test-connection: false
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
            protocols: TLSv1.2
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        debug: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 2000ms

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:}
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:720440096298-6derr612hrvjof7bobr8p0s75amcjgqi.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            scope:
              - email
              - profile
              - openid
            redirect-uri: "{baseUrl}/api/auth/google/callback"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET:mySecretKeyREDACTED_PASSWORD67890REDACTED_PASSWORD67890REDACTED_PASSWORD67890REDACTED_PASSWORD67890REDACTED_PASSWORD67890REDACTED_PASSWORD67890}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  upload:
    cv-dir: ${FILE_UPLOAD_CV_DIR:./uploads/cvs}
    certificate-dir: ${FILE_UPLOAD_CERT_DIR:./uploads/certificates}
    avatar-dir: ${FILE_UPLOAD_AVATAR_DIR:./uploads/avatars}
    event-dir: ${FILE_UPLOAD_EVENT_DIR:./uploads/events}
    max-file-size: 10MB
    allowed-extensions:
      cv: pdf,doc,docx
      certificate: pdf,png,jpg,jpeg
      avatar: png,jpg,jpeg
      event: png,jpg,jpeg,gif,webp

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:}
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  compression:
    enabled: true
    mime-types: >
      text/html,text/xml,text/plain,text/css,
      text/javascript,application/javascript,application/json
  http2:
    enabled: true

app:
  name: S-PACE
  version: ${APP_VERSION:1.0.0}
  environment: ${APP_ENV:development}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://s-pace.com.vn,https://www.s-pace.com.vn,https://api.s-pace.com.vn}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  storage:
    type: ${STORAGE_TYPE:cloud} # cloud or local

logging:
  level:
    com.example.S_PACE: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}
    org.flywaydb: INFO
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
    org.hibernate.type.descriptor.sql: WARN
    org.springframework.web: ${WEB_LOG_LEVEL:WARN}
  file:
    name: ${LOG_FILE_PATH:./logs/space-app.log}

# AWS S3 Configuration
aws:
  s3:
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    region: ${AWS_REGION:ap-southeast-1}
    bucket-name: ${AWS_S3_BUCKET_NAME}
    endpoint: ${AWS_S3_ENDPOINT:}
    cloudfront-domain: ${AWS_CLOUDFRONT_DOMAIN:}
    public-url: ${AWS_S3_PUBLIC_URL:}

# App Configuration (merged above)

management:
  endpoints.web:
    exposure.include: health,info,metrics,prometheus,flyway
    base-path: /actuator
  endpoint.health:
    show-details: when-authorized
    show-components: always
  endpoint.info.enabled: true
  info:
    env.enabled: true
    git.mode: full
    build.enabled: true

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  show-actuator: false

spring.jpa.open-in-view: false

---
spring:
  config.activate.on-profile: dev
  jpa.show-sql: true
  jpa.properties.hibernate.format_sql: true
logging:
  level:
    com.example.S_PACE: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

---
spring:
  config.activate.on-profile: prod
  datasource.hikari:
    maximum-pool-size: 30
    minimum-idle: 10
  jpa.show-sql: false
  jpa.properties.hibernate.format_sql: false
logging:
  level:
    com.example.S_PACE: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
